<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request Explorer</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17243a;
        --muted: #647087;
        --line: #dbe2ec;
        --panel: #ffffff;
        --canvas: #f3f6fa;
        --accent: #6555a8;
        --accent-dark: #4d3f89;
        --accent-soft: #f0edfb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, rgba(101, 85, 168, 0.08), transparent 22rem),
          var(--canvas);
      }

      main {
        width: min(960px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 28px;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .scenario-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }

      .scenario-button {
        min-height: 44px;
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 3px 12px rgba(23, 36, 58, 0.04);
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .scenario-button:hover {
        border-color: #b6aecf;
        transform: translateY(-1px);
      }

      .scenario-button:active {
        transform: translateY(0);
      }

      .scenario-button.is-active {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .scenario-button:focus-visible {
        outline: 3px solid rgba(101, 85, 168, 0.28);
        outline-offset: 3px;
      }

      .result {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 18px 44px rgba(23, 36, 58, 0.08);
      }

      .result-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 72px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
      }

      .result-heading h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #fbe9e8;
        color: #9e302a;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .status-pill.is-success {
        background: #e5f4e9;
        color: #21763a;
      }

      .status-pill.is-neutral {
        background: var(--accent-soft);
        color: var(--accent-dark);
      }

      .result-body {
        padding: 24px;
      }

      .summary {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
      }

      .details {
        display: grid;
        grid-template-columns: 120px 1fr;
        margin: 0;
      }

      .details dt,
      .details dd {
        margin: 0;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }

      .details dt {
        color: var(--muted);
        font-weight: 700;
      }

      .details dd {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .details dt:last-of-type,
      .details dd:last-of-type {
        border-bottom: 0;
      }

      @media (max-width: 600px) {
        main {
          width: min(100% - 28px, 960px);
          padding: 32px 0;
        }

        h1 {
          margin-bottom: 22px;
        }

        .scenario-nav {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .scenario-button {
          padding-inline: 10px;
        }

        .result-heading {
          padding-inline: 18px;
        }

        .result-body {
          padding: 18px;
        }

        .details {
          grid-template-columns: 92px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Request Explorer</h1>

      <nav class="scenario-nav" aria-label="Request scenarios">
        <button class="scenario-button" type="button" data-scenario="success">Success</button>
        <button class="scenario-button" type="button" data-scenario="httpError">
          HTTP Error
        </button>
        <button class="scenario-button" type="button" data-scenario="invalidJson">
          Invalid JSON
        </button>
        <button class="scenario-button" type="button" data-scenario="businessFailure">
          Business Failure
        </button>
      </nav>

      <section class="result" aria-live="polite">
        <header class="result-heading">
          <h2 id="result-title">Request result</h2>
          <span id="status-pill" class="status-pill is-neutral">Not requested</span>
        </header>

        <div class="result-body">
          <p id="message" class="summary">Select a request scenario to inspect its response.</p>
          <dl class="details">
            <dt>Method</dt>
            <dd id="method">—</dd>

            <dt>URL</dt>
            <dd id="url">—</dd>

            <dt>HTTP status</dt>
            <dd id="status">—</dd>
          </dl>
        </div>
      </section>
    </main>

    <script>
      const responses = {
        success: {
          label: "Mock data",
          method: "GET",
          url: "/api/ok",
          status: 200,
          message: "The request completed successfully.",
          tone: "success"
        },
        httpError: {
          label: "Mock data",
          method: "GET",
          url: "/api/http-error",
          status: 422,
          message: "The server reported an HTTP error.",
          tone: "error"
        },
        invalidJson: {
          label: "Mock data",
          method: "GET",
          url: "/api/invalid-json",
          status: 200,
          message: "The server returned invalid JSON.",
          tone: "error"
        },
        businessFailure: {
          label: "Mock data",
          method: "GET",
          url: "/api/business-failure",
          status: 200,
          message: "The operation was rejected by the domain rules.",
          tone: "neutral"
        }
      };

      const buttons = document.querySelectorAll(".scenario-button");
      const resultTitle = document.querySelector("#result-title");
      const statusPill = document.querySelector("#status-pill");
      const message = document.querySelector("#message");
      const method = document.querySelector("#method");
      const url = document.querySelector("#url");
      const status = document.querySelector("#status");

      buttons.forEach((button) => {
        button.addEventListener("click", async () => {
        let response = responses[button.dataset.scenario];

        if (
          button.dataset.scenario === "success" ||
          button.dataset.scenario === "httpError" ||
          button.dataset.scenario === "invalidJson" ||
          button.dataset.scenario === "businessFailure"
        ) {
          try {
            const httpResponse = await fetch(response.url);

            try {
              const data = await httpResponse.json();
              const isBusinessFailure = httpResponse.ok && data.ok === false;

              response = {
                ...response,
                status: httpResponse.status,
                message: !httpResponse.ok
                  ? data.error
                  : isBusinessFailure
                    ? data.error
                    : data.message,
                label: "Live HTTP",
                tone: !httpResponse.ok
                  ? "error"
                  : isBusinessFailure
                    ? "neutral"
                    : "success"
              };
            } catch (error) {
              console.log("JSON parsing failed:", error.message);

              response = {
                ...response,
                status: httpResponse.status,
                message: "The server returned invalid JSON.",
                label: "Live HTTP",
                tone: "error"
              };
            }
          } catch (error) {
            console.log("Network request failed:", error.message);

            response = {
              ...response,
              status: "N/A",
              message: "Cannot connect to the server.",
              label: "Network error",
              tone: "error"
            };
          }
        }


          buttons.forEach((item) => {
            item.classList.remove("is-active");
          });
          button.classList.add("is-active");

          statusPill.className = "status-pill";
          if (response.tone === "success") {
            statusPill.classList.add("is-success");
          } else if (response.tone === "neutral") {
            statusPill.classList.add("is-neutral");
          }

          resultTitle.textContent =
            response.label === "Live HTTP" || response.label === "Network error"
              ? "Request result"
              : "Simulated result";
          statusPill.textContent = response.label;
          message.textContent = response.message;
          method.textContent = response.method;
          url.textContent = response.url;
          status.textContent = response.status;
        });
      });
    </script>
  </body>
</html>
